#基础配置
baseURL: 'http://ry5228.github.io'
title: 'Yi Ren'
theme: 'ananke'
defaultContentLanguage: 'zh'
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

#语言与菜单配置
languages:
  zh:
    locale: 'zh-CN'
    label: '中文'
    title: '任毅'
    weight: 1
    menu:
      main:
        - name: 首页
          url: /
          weight: 10
        - name: 论文
          url: /publications/
          weight: 30
        - name: 搜索
          url: /search/
          weight: 40
  en:
    locale: 'en-US'
    label: 'English'
    title: 'Yi Ren'
    weight: 2
    menu:
      main:
        - name: Home
          url: /en/
          weight: 10
        - name: Publications
          url: /publications/
          weight: 30
        - name: Search
          url: /search/
          weight: 40

#主题配置参数
params:
  ananke_socials:
    - name: github
      url: "https://github.com/RY5228"
