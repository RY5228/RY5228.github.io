name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Restore CV PDFs
        id: cv-cache
        uses: actions/cache@v4
        with:
          path: |
            files/ren-yi-cv-zh.pdf
            files/yi-ren-cv-en.pdf
          key: ${{ runner.os }}-cv-pdfs-${{ hashFiles('_cv_latex/**/*.tex', '_cv_latex/**/*.sty', '_cv_latex/**/*.bib', '_cv_latex/**/*.jpg', '.github/workflows/jekyll.yml') }}
      - name: Compile Chinese CV
        if: steps.cv-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv-llt.tex
          working_directory: _cv_latex/zh
          latexmk_use_xelatex: true
      - name: Compile English CV
        if: steps.cv-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv-llt.tex
          working_directory: _cv_latex/en
          latexmk_use_xelatex: true
      - name: Stage CV PDFs
        if: steps.cv-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p files
          cp _cv_latex/zh/cv-llt.pdf files/ren-yi-cv-zh.pdf
          cp _cv_latex/en/cv-llt.pdf files/yi-ren-cv-en.pdf
      - name: Check CV PDFs
        run: |
          test -f files/ren-yi-cv-zh.pdf
          test -f files/yi-ren-cv-en.pdf
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
